<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício de Tabela</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    h2 {
      margin: 5px 0 15px 0;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 500px;
    }
    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }

    .cnome {
      background-color: palevioletred;
    }

    .cprof {
      background-color: greenyellow;
    }

    .cgrupo {
      background-color: yellow;
    }
  </style>
</head>
<body>

  <h1>Exercício de Tabela</h1>
  
  <caption>Cadastro</caption>

  <table>

    <colgroup>
      <col class="cnome">
      <col class="cgrupo" span="2">
      <col class="cprof">
    </colgroup>

    <tr>
      <th scope="col" class="cnome">Nome</th>
      <th scope="col" class="cgrupo">Sexo</th>
      <th scope="col" class="cgrupo">Idade</th>
      <th scope="col" class="cprof">Profissão</th>
    </tr>
    <tr>
      <td>Ana Maria</td>
      <td>F</td>
      <td>25</td>
      <td>Jornalista</td>
    </tr>
    <tr>
      <td>Cláudio</td>
      <td>M</td>
      <td>28</td>
      <td>Programador</td>
    </tr>
    <tr>
      <td>Gustavo</td>
      <td>M</td>
      <td>42</td>
      <td>Professor</td>
    </tr>
    <tr>
      <td>Hélio</td>
      <td>M</td>
      <td>19</td>
      <td>Vendedor</td>
    </tr>
    <tr>
      <td>Maria</td>
      <td>F</td>
      <td>39</td>
      <td>Médica</td>
    </tr>
    <tr>
      <td>Otávio</td>
      <td>M</td>
      <td>22</td>
      <td>Nutricionista</td>
    </tr>
  </table>

</body>
</html>
