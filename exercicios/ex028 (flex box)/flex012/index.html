<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .conteiner {
            background-color: lightslategray;
            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            background-color: turquoise;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;

        }

        #cx1 {
            /*flex-grow: 1;
            flex-shrink: 0;    
            flex-basis: 200px;*/

            flex: 1 0 200px;
        }

        #cx2 {
            /*flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 150px;*/

            flex: 1 1 150px;
        }

        #cx3 {
            /*flex-grow: 1;
            flex-shrink: 8;
            flex-basis: auto;*/

            flex: 1 8 auto;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cx1">1</div>
        <div class="item" id="cx2">2</div>
        <div class="item" id="cx3">3</div>
    </div>
</body>
</html>
