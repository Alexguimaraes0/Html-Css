<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição em Evento</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <h1>Formulário de Inscrição em Evento</h1>
    <form action="/submit" method="post" autocomplete="on">

        <div>

            <label for="inome">Nome Completo</label><br>
            <input type="text" id="inome" name="nome" required placeholder="Digite seu nome" autocomplete="username"><br><br>

        </div>

        <div>

            <label for="iemail">Email</label><br>
            <input type="email" id="iemail" name="email" required placeholder="email@exemplo.com"  autocomplete="email"><br><br>

        </div>

        <div>

            <label for="itelefone">Telefone</label><br>
            <input type="text" id="itelefone" name="telefone" required placeholder="(xx) xxxxx-xxxx" autocomplete="tel" size="11" maxlength="11"><br><br>

        </div>

        <div>

            <label for="idata">Data de nascimento</label> <br>
            <input type="date" name="data" id="idata" required ><br><br>

        </div>

        <div>
            <label for="iarea"> Escolher área de interesse</label> <br>
            <input type="checkbox" name="interesse" id="front-end" required> Front-end
            <input type="checkbox" name="interesse" id="front-end"> Back-end
            <input type="checkbox" name="interesse" id="front-end"> UX/UI
        </div> <br> <br>

        <div>
            <label for="turno">
                Turno preferido
            </label> <br>
            <label for="manha"></label>
            <input type="radio" name="turno" id="manha" checked required value="manha"> Manhã

            <label for="tarde"></label>
            <input type="radio" name="turno" id="tarde"  value="tarde"> Tarde
            
            <label for="noite"></label>
            <input type="radio" name="turno" id="noite"  value="noite" > Noite
        </div> <br> <br>

        <div>
            <label for="icurriculo">Uplouad de arquivo</label> <br>
            <input type="file" name="curriculo" id="icurriculo" required >
            <p id="apenaspdf">Envie seu currículo (apenas arquivos em PDF)</p>
        </div> <br> <br>

        <div>
            <label for="iobservacoes">Observações</label> <br>
            <textarea name="observacoes" id="iobservacoes" placeholder="Escreva algo se desejar"></textarea>
        </div>

        <div>
            <input type="submit" value="Enviar Inscrição">
        </div>

    </form>    




</body>
</html>
